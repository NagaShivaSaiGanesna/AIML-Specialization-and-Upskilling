
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{max-width:420px;margin:0 auto;padding:0.75rem}

/* day selector */
.day-strip{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:5px 12px;border-radius:99px;border:0.5px solid var(--color-border-secondary);font-size:12px;cursor:pointer;background:transparent;color:var(--color-text-secondary);white-space:nowrap}
.day-pill.active{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent;font-weight:500}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 6px;text-align:center}
.stat-val{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.stat-label{font-size:10px;color:var(--color-text-secondary);margin-top:1px}

/* fat loss card */
.fat-card{background:var(--color-background-success);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.fat-left{}
.fat-title{font-size:11px;color:var(--color-text-success);font-weight:500}
.fat-val{font-size:22px;font-weight:500;color:var(--color-text-success);margin-top:2px}
.fat-sub{font-size:10px;color:var(--color-text-success);margin-top:2px;opacity:0.8}
.fat-right{text-align:right}
.fat-week{font-size:11px;color:var(--color-text-success);opacity:0.8}
.fat-week-val{font-size:16px;font-weight:500;color:var(--color-text-success)}

/* progress bar */
.prog-section{margin-bottom:14px}
.prog-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--color-text-secondary);margin-bottom:5px}
.prog-label span:last-child{font-weight:500;color:var(--color-text-primary)}
.prog-track{height:6px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-green{background:var(--color-text-success)}
.fill-blue{background:var(--color-text-info)}
.fill-amber{background:var(--color-text-warning)}

/* section headers */
.sec-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px;letter-spacing:0.03em}

/* checklist */
.checklist{margin-bottom:14px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:6px;cursor:pointer;transition:opacity .15s;user-select:none}
.check-item.done{opacity:0.45}
.check-item.done .ci-name{text-decoration:line-through}
.checkbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--color-border-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.check-item.done .checkbox{background:var(--color-background-success);border-color:transparent}
.tick{display:none;font-size:11px;color:white;font-weight:600}
.check-item.done .tick{display:block}
.ci-right{flex:1}
.ci-name{font-size:13px;color:var(--color-text-primary);line-height:1.4}
.ci-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px;line-height:1.4}
.ci-weight{display:inline-block;font-size:10px;font-weight:500;padding:1px 6px;border-radius:99px;background:var(--color-background-info);color:var(--color-text-info);margin-top:3px}

/* step counter */
.step-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:14px}
.step-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step-num{font-size:28px;font-weight:500;color:var(--color-text-primary)}
.step-goal{font-size:12px;color:var(--color-text-secondary)}
.step-btns{display:flex;gap:6px}
.step-btn{flex:1;padding:8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:12px;cursor:pointer;background:transparent;color:var(--color-text-primary)}
.step-btn:active{transform:scale(0.97)}

/* completion banner */
.done-banner{display:none;background:var(--color-background-success);border-radius:var(--border-radius-md);padding:10px 14px;text-align:center;font-size:13px;font-weight:500;color:var(--color-text-success);margin-bottom:14px}

/* reset btn */
.reset-btn{width:100%;padding:10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:12px;cursor:pointer;background:transparent;color:var(--color-text-secondary);margin-top:4px}
</style>

<div class="app">

  <!-- Day selector -->
  <div style="font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px">Daily tracker</div>
  <div class="day-strip" id="dayStrip"></div>

  <!-- Fat loss card -->
  <div class="fat-card">
    <div class="fat-left">
      <div class="fat-title">Fat burned today</div>
      <div class="fat-val" id="fatToday">0g</div>
      <div class="fat-sub" id="fatSub">Complete tasks to burn fat</div>
    </div>
    <div class="fat-right">
      <div class="fat-week">This week</div>
      <div class="fat-week-val" id="fatWeek">0g</div>
      <div class="fat-week" style="margin-top:4px">Month est.</div>
      <div class="fat-week-val" id="fatMonth">0g</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statKcal">0</div><div class="stat-label">kcal deficit</div></div>
    <div class="stat"><div class="stat-val" id="statDone">0/0</div><div class="stat-label">tasks done</div></div>
    <div class="stat"><div class="stat-val" id="statSteps">0</div><div class="stat-label">steps</div></div>
  </div>

  <!-- Progress bars -->
  <div class="prog-section">
    <div class="prog-label"><span>Meals</span><span id="mealProg">0/0</span></div>
    <div class="prog-track"><div class="prog-fill fill-green" id="mealBar" style="width:0%"></div></div>
  </div>
  <div class="prog-section">
    <div class="prog-label"><span>Workout</span><span id="workProg">0/0</span></div>
    <div class="prog-track"><div class="prog-fill fill-blue" id="workBar" style="width:0%"></div></div>
  </div>
  <div class="prog-section">
    <div class="prog-label"><span>Steps (10,000 goal)</span><span id="stepProg">0%</span></div>
    <div class="prog-track"><div class="prog-fill fill-amber" id="stepBar" style="width:0%"></div></div>
  </div>

  <div class="done-banner" id="doneBanner">All done today! Great work Shiva!</div>

  <!-- Checklist -->
  <div id="checklistContainer"></div>

  <!-- Step counter -->
  <div class="sec-title">Steps tracker</div>
  <div class="step-box">
    <div class="step-row">
      <div>
        <div class="step-goal">Today's steps</div>
        <div class="step-num" id="stepCount">0</div>
      </div>
      <div style="flex:1;text-align:right;font-size:12px;color:var(--color-text-secondary)">Goal: 10,000</div>
    </div>
    <div class="step-btns">
      <button class="step-btn" onclick="addSteps(1000)">+1,000</button>
      <button class="step-btn" onclick="addSteps(2000)">+2,000</button>
      <button class="step-btn" onclick="addSteps(5000)">+5,000</button>
      <button class="step-btn" onclick="setSteps(10000)">Done 10K</button>
    </div>
  </div>

  <button class="reset-btn" onclick="resetDay()">Reset today</button>
</div>

<script>

    meals:[
      {name:'Banana (pre-workout)',sub:'5:05 AM',weight:'1 whole ~120g',kcal:90},
      {name:'Oats with milk',sub:'6:45 AM — breakfast',weight:'60g oats + 200ml milk + 15g groundnuts',kcal:380},
      {name:'Boiled egg + roasted chana',sub:'10:30 AM',weight:'1 egg ~60g + 30g chana',kcal:180},
      {name:'Egg curry + rice + sabzi',sub:'1:00 PM — lunch dabba',weight:'2 eggs + 80g rice dry + 100g sabzi',kcal:550},

    meals:[

    ],

      {name:'No workout — full rest',sub:'Muscles grow on rest days',kcal:0},

// State
var state = {day:'Mon', steps:0, checks:{}};
DAYS.forEach(function(d){state.checks[d]={meals:{},exercises:{}}});

function init(){
  // Build day strip
  var strip = document.getElementById('dayStrip');
  DAYS.forEach(function(d){
    var btn = document.createElement('button');
    btn.className='day-pill'+(d==='Mon'?' active':'');
    btn.textContent=d;
    btn.onclick=function(){switchDay(d)};
    strip.appendChild(btn);
  });
  renderDay();
}

function switchDay(d){
  state.day=d;
  document.querySelectorAll('.day-pill').forEach(function(b,i){
    b.classList.toggle('active', DAYS[i]===d);
  });
  renderDay();
}

function renderDay(){
  var d=state.day;
  var plan=PLAN[d];
  var mChecks=state.checks[d].meals;
  var eChecks=state.checks[d].exercises;

  // Checklist
  var container=document.getElementById('checklistContainer');
  container.innerHTML='';

  // Meals section
  var mTitle=document.createElement('div');
  mTitle.className='sec-title';
  mTitle.textContent='Meals — '+plan.meals.length+' today';
  container.appendChild(mTitle);

  var mList=document.createElement('div');
  mList.className='checklist';
  plan.meals.forEach(function(m,i){
    var item=document.createElement('div');
    item.className='check-item'+(mChecks[i]?' done':'');
    item.onclick=function(){toggleCheck('meals',i)};
    item.innerHTML='<div class="checkbox"><span class="tick">✓</span></div><div class="ci-right"><div class="ci-name">'+m.name+'</div><div class="ci-sub">'+m.sub+'</div>'+(m.weight&&m.weight!=='No food yet'&&m.weight!=='No weighing today'?'<span class="ci-weight">'+m.weight+'</span>':'')+'</div>';
    mList.appendChild(item);
  });
  container.appendChild(mList);

  // Exercise section
  var eTitle=document.createElement('div');
  eTitle.className='sec-title';
  eTitle.textContent='Workout — '+plan.workout;
  container.appendChild(eTitle);

  var eList=document.createElement('div');
  eList.className='checklist';
  plan.exercises.forEach(function(e,i){
    var item=document.createElement('div');
    item.className='check-item'+(eChecks[i]?' done':'');
    item.onclick=function(){toggleCheck('exercises',i)};
    item.innerHTML='<div class="checkbox"><span class="tick">✓</span></div><div class="ci-right"><div class="ci-name">'+e.name+'</div><div class="ci-sub">'+e.sub+'</div></div>';
    eList.appendChild(item);
  });
  container.appendChild(eList);

  updateStats();
}

function toggleCheck(type, i){
  var d=state.day;
  state.checks[d][type][i]=!state.checks[d][type][i];
  renderDay();
}

function updateStats(){
  var d=state.day;
  var plan=PLAN[d];
  var mChecks=state.checks[d].meals;
  var eChecks=state.checks[d].exercises;

  var mDone=Object.values(mChecks).filter(Boolean).length;
  var eDone=Object.values(eChecks).filter(Boolean).length;
  var total=plan.meals.length+plan.exercises.length;
  var done=mDone+eDone;

  // Deficit calc — scales with completion
  var mTotal=plan.meals.length||1;
  var eTotal=plan.exercises.length||1;
  var mRatio=mDone/mTotal;
  var eRatio=eDone/eTotal;
  // Diet deficit + exercise burn + steps burn
  var stepsBurn=Math.round(state.steps*0.04);
  var dietDeficit=Math.round(plan.deficit*mRatio);
  var exBurn=0;
  plan.exercises.forEach(function(e,i){if(eChecks[i])exBurn+=e.kcal});
  var totalDeficit=dietDeficit+exBurn+stepsBurn;

  // Fat burned: 1g fat = 7.7 kcal
  var fatG=Math.round(totalDeficit/7.7);
  var fatWeek=Math.round(fatG*5.5);
  var fatMonth=Math.round(fatG*24);

  document.getElementById('fatToday').textContent=fatG+'g';
  document.getElementById('fatSub').textContent='~'+totalDeficit+' kcal deficit today';
  document.getElementById('fatWeek').textContent=fatWeek+'g';
  document.getElementById('fatMonth').textContent=fatMonth+'g (~'+(fatMonth/1000).toFixed(2)+'kg)';

  document.getElementById('statKcal').textContent=totalDeficit;
  document.getElementById('statDone').textContent=done+'/'+total;
  document.getElementById('statSteps').textContent=state.steps.toLocaleString();

  // Progress bars
  document.getElementById('mealProg').textContent=mDone+'/'+plan.meals.length;
  document.getElementById('mealBar').style.width=Math.round(mDone/plan.meals.length*100)+'%';
  document.getElementById('workProg').textContent=eDone+'/'+plan.exercises.length;
  document.getElementById('workBar').style.width=Math.round(eDone/plan.exercises.length*100)+'%';
  var stepPct=Math.min(100,Math.round(state.steps/10000*100));
  document.getElementById('stepProg').textContent=stepPct+'%';
  document.getElementById('stepBar').style.width=stepPct+'%';
  document.getElementById('stepCount').textContent=state.steps.toLocaleString();

  // Done banner
  var banner=document.getElementById('doneBanner');
  banner.style.display=(done===total&&total>0)?'block':'none';
}

function addSteps(n){
  state.steps=Math.min(20000,state.steps+n);
  updateStats();
}
function setSteps(n){
  state.steps=n;
  updateStats();
}
function resetDay(){
  var d=state.day;
  state.checks[d]={meals:{},exercises:{}};
  state.steps=0;
  renderDay();
}

init();
</script>
